{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
  <div class="w-11 h-11 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg mb-4">
    <i class="fa-solid fa-right-to-bracket"></i>
  </div>
  <h1 class="text-xl font-bold text-slate-900 mb-1">Öğrenci Girişi</h1>
  <p class="text-sm text-slate-500 mb-6">Hesabınıza giriş yapın.</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">E-posta</label>
      <input type="email" name="email" required class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Şifre</label>
      <input type="password" name="password" required class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
    </div>
    <button type="submit" class="w-full rounded-lg bg-indigo-600 text-white font-semibold py-2.5 hover:bg-indigo-700 transition">
      Giriş Yap
    </button>
  </form>
  <p class="text-sm text-slate-500 mt-5 text-center">
    Hesabınız yok mu? <a href="{{ url_for('student_register') }}" class="text-indigo-600 font-semibold">Kayıt olun</a>
  </p>
</div>
{% endblock %}
