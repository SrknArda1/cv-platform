{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
  <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg mb-4">
    <i class="fa-solid fa-building"></i>
  </div>
  <h1 class="text-xl font-bold text-slate-900 mb-1">Kurum Kaydı</h1>
  <p class="text-sm text-slate-500 mb-6">Aday havuzuna erişmek için hesap oluşturun.</p>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Kurum Adı</label>
      <input type="text" name="company_name" required class="w-full rounded-lg border-slate-300 focus:border-emerald-500 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Yetkili Kişi</label>
      <input type="text" name="contact_person" class="w-full rounded-lg border-slate-300 focus:border-emerald-500 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">E-posta</label>
      <input type="email" name="email" required class="w-full rounded-lg border-slate-300 focus:border-emerald-500 focus:ring-emerald-500">
    </div>
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Şifre</label>
      <input type="password" name="password" required minlength="6" class="w-full rounded-lg border-slate-300 focus:border-emerald-500 focus:ring-emerald-500">
    </div>
    <button type="submit" class="w-full rounded-lg bg-emerald-600 text-white font-semibold py-2.5 hover:bg-emerald-700 transition">
      Kayıt Ol
    </button>
  </form>
  <p class="text-sm text-slate-500 mt-5 text-center">
    Zaten hesabınız var mı? <a href="{{ url_for('company_login') }}" class="text-emerald-600 font-semibold">Giriş yapın</a>
  </p>
</div>
{% endblock %}
